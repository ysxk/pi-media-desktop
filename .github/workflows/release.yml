name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install plugin devkit
        # The devkit lives in the PI-Desktop monorepo; clone it outside the
        # plugin tree so `pi-plugin check` does not count it as plugin files.
        run: |
          git clone --depth 1 https://github.com/vastsa/PI-Desktop.git "$RUNNER_TEMP/pi-desktop"
          cd "$RUNNER_TEMP/pi-desktop"
          pnpm install --filter @pi-desktop/plugin-devkit...
          pnpm --filter @pi-desktop/plugin-sdk run build
          pnpm --filter @pi-desktop/plugin-devkit run build

      - name: pi-plugin check
        run: |
          node "$RUNNER_TEMP/pi-desktop/packages/plugin-devkit/dist/cli.js" check .

      - name: pi-plugin pack
        run: |
          node "$RUNNER_TEMP/pi-desktop/packages/plugin-devkit/dist/cli.js" pack .

      - name: Create GitHub release with .piplug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(ls dist/*.piplug | head -n1)
          NAME=$(basename "$PKG" .piplug)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "$PKG" \
            --title "$NAME" \
            --notes "PI-Desktop → Plugins → Install plugin package → choose \`$(basename "$PKG")\`"
